name: GutCheck
options:
  bundleIdPrefix: com.meagan
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
targets:
  GutCheck:
    type: application
    platform: iOS
    sources:
      # Secrets.plist is excluded so the committed xcodeproj never references
      # it; the post-build script bundles it only when present locally.
      - path: GutCheck
        excludes:
          - "Secrets.plist"
    postBuildScripts:
      - name: Copy Secrets.plist (optional, local only)
        script: |
          if [ -f "$SRCROOT/GutCheck/Secrets.plist" ]; then
            cp "$SRCROOT/GutCheck/Secrets.plist" "$CODESIGNING_FOLDER_PATH/Secrets.plist"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.meagan.gutcheck
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Scoop"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
